aggiungi_coordinatore_zigbee:
  name: Aggiungi coordinatore Zigbee
  description: Crea una seconda rete Zigbee con un'altra chiavetta coordinatore.
  fields:
    porta:
      name: Porta
      description: Percorso della chiavetta (vuoto = trovata da sola)
      example: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus-if00-port0
      selector:
        text:
    tipo:
      name: Tipo di chiavetta
      description: Tipo di coordinatore (vuoto = automatico)
      selector:
        select:
          options: [zstack, ember, ezsp, deconz, zigate, zboss]
riconfigura:
  name: Rifai configurazione MDM
  description: Ripete la configurazione automatica (app, tema, automazioni cliente).
