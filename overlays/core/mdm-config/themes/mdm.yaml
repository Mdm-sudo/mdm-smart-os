# Tema MDM Smart: scuro, colori presi dal logo (casa arcobaleno)
MDM:
  modes:
    dark:
      primary-color: "#8b5cf6"
      accent-color: "#22c3a6"
      primary-background-color: "#0f0a1e"
      secondary-background-color: "#170f2e"
      card-background-color: "#1b1433"
      ha-card-background: "#1b1433"
      ha-card-border-color: "#2c2350"
      ha-card-border-radius: "18px"
      app-header-background-color: "#0f0a1e"
      app-header-text-color: "#f2f0fa"
      sidebar-background-color: "#120c24"
      sidebar-text-color: "#d4d0e8"
      sidebar-selected-text-color: "#c4b5fd"
      sidebar-selected-icon-color: "#c4b5fd"
      primary-text-color: "#f2f0fa"
      secondary-text-color: "#a9a3c4"
      divider-color: "#2c2350"
      state-icon-color: "#a78bfa"
      state-active-color: "#fbbf24"
      switch-checked-color: "#22c3a6"
      input-fill-color: "#241a45"
      mdc-theme-primary: "#8b5cf6"
    light:
      primary-color: "#7c3aed"
      accent-color: "#0d9488"
      primary-background-color: "#f6f5fa"
      card-background-color: "#ffffff"
      ha-card-border-radius: "18px"
