# MDM Smart OS – configurazione di base
# Creata al primo avvio. Le parti MDM sono in /config/mdm e /config/themes.

default_config:

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/mdm/kiosk-mode.js?v=1
    - /local/mdm/scheduler-card.js?v=1
    - /local/mdm/mdm-preparazione.js?v=1
    - /local/mdm/mdm-casa.js?v=1

http: !include mdm/http.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Configurazione automatica MDM (app, tema, Zigbee, assistenti vocali)
mdm:
